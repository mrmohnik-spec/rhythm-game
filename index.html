<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rhythm Master - Classical Edition</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #04040a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            /* بهینه‌سازی سخت‌افزاری برای WebView تلگرام */
            transform: translateZ(0);
            will-change: transform;
        }
        #menuOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 4, 10, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
            padding: 24px 20px;
            overflow-y: auto;
        }
        .title { color: #fff; font-size: 26px; font-weight: 800; margin-bottom: 4px; }
        .subtitle { color: #8a8a9e; font-size: 13px; margin-bottom: 16px; }
        .song-card {
            width: 100%; max-width: 320px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px; padding: 12px 16px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; flex-shrink: 0;
        }
        .song-card.locked { opacity: 0.4; cursor: not-allowed; }
        .song-info h3 { color: #fff; font-size: 15px; margin-bottom: 2px; }
        .song-info p { color: #8a8a9e; font-size: 12px; }
        .play-btn { background: #6366f1; color: #fff; padding: 8px 14px; border-radius: 18px; font-size: 12px; font-weight: 700; }
        .locked .play-btn { background: #333; color: #777; }
        #backBtn {
            position: absolute; top: 16px; left: 16px; z-index: 5;
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12px; display: none; cursor: pointer;
        }
        #levelCompleteNotice {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: #22c55e; color: white; padding: 8px 16px; border-radius: 20px;
            font-size: 13px; font-weight: bold; display: none; z-index: 6;
        }
    </style>
</head>
<body>

<div id="levelCompleteNotice">🎉 مرحله بعدی باز شد!</div>
<div id="menuOverlay">
    <div class="title">RHYTHM MASTER</div>
    <div class="subtitle">شاهکارهای موسیقی کلاسیک</div>
    <div id="levelsList" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
</div>

<button id="backBtn" onclick="showMenu()">منو ☰</button>
<canvas id="gameCanvas"></canvas>

<script>
/* ==========================================
   1. TELEGRAM SDK & AUDIO ENGINE (iOS Fixed)
   ========================================== */
const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#04040a');
    tg.setBackgroundColor('#04040a');
}

function buzz(type = 'light') {
    if (tg && tg.HapticFeedback) {
        if (type === 'heavy') tg.HapticFeedback.impactOccurred('heavy');
        else tg.HapticFeedback.impactOccurred('light');
    } else if (navigator.vibrate) {
        try { navigator.vibrate(10); } catch (_) {}
    }
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;

// حل کامل مشکل صدای آیفون (iOS)
function unlockAudioiOS() {
    if (!actx) {
        actx = new AudioCtx();
    }
    if (actx.state === 'suspended') {
        actx.resume();
    }
    // یک صدای بی‌صدا کوتاه ایجاد می‌کنیم تا قفل iOS کلاً باز شود
    const buffer = actx.createBuffer(1, 1, 22050);
    const source = actx.createBufferSource();
    source.buffer = buffer;
    source.connect(actx.destination);
    source.start(0);
}

// ثبت لمس اول روی صفحه برای باز کردن صدا در iOS
window.addEventListener('touchstart', unlockAudioiOS, { once: true });
window.addEventListener('click', unlockAudioiOS, { once: true });

const NOTE_FREQS = {
    'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94, 'C4': 261.63, 'C#4': 277.18, 'D4': 293.66,
    'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
    'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88, 'C5': 523.25,
    'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46,
    'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77, 'C6': 1046.50
};

function playPluck(freq, duration = 0.4) {
    if (!actx) return;
    if (actx.state === 'suspended') actx.resume();

    const now = actx.currentTime;
    const osc = actx.createOscillator();
    const gain = actx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);

    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

    osc.connect(gain);
    gain.connect(actx.destination);

    osc.start(now);
    osc.stop(now + duration);
}

            [26, 0, 'G4', 0], [27, 1, 'G4', 0], [28, 2, 'C5', 0], [29, 1, 'G4', 0],
            [30, 2, 'C5', 0], [31, 3, 'E5', 2],
            [35, 3, 'G5', 0], [36, 3, 'G5', 0], [37, 3, 'G5', 0], [38, 2, 'C5', 3],
            [43, 2, 'A#4', 0], [44, 2, 'A#4', 0], [45, 2, 'A#4', 0], [46, 1, 'G4', 4]
        ]
    }
};

const LEVELS = [
    { id: 1, songKey: 'mountain_king', targetScore: 1000 },
    { id: 2, songKey: 'turkish_march', targetScore: 2000 },
    { id: 3, songKey: 'fur_elise',     targetScore: 3000 },
    { id: 4, songKey: 'symphony_5',    targetScore: 4000 }
];

let currentLevelIndex = 0;
let unlockedLevel = parseInt(localStorage.getItem('unlocked_level') || '1');

function renderMenu() {
    const list = document.getElementById('levelsList');
    list.innerHTML = '';
    LEVELS.forEach((lvl, idx) => {
        const song = SONGS[lvl.songKey];
        const isUnlocked = lvl.id <= unlockedLevel;
        const card = document.createElement('div');
        card.className = `song-card ${isUnlocked ? '' : 'locked'}`;
        card.innerHTML = `
            <div class="song-info">
                <h3>مرحله ${lvl.id}: ${song.title} ${isUnlocked ? '' : '🔒'}</h3>
                <p>هدف: ${lvl.targetScore} امتیاز</p>
            </div>
            <div class="play-btn">${isUnlocked ? 'شروع' : 'قفل'}</div>
        `;
        if (isUnlocked) card.onclick = () => selectLevel(idx);
        list.appendChild(card);
    });
}

function unlockNextLevel() {
    const nextLevelId = LEVELS[currentLevelIndex].id + 1;
    if (nextLevelId > unlockedLevel && nextLevelId <= LEVELS.length) {
        unlockedLevel = nextLevelId;
        localStorage.setItem('unlocked_level', unlockedLevel);
        const notice = document.getElementById('levelCompleteNotice');
        notice.style.display = 'block';
        setTimeout(() => { notice.style.display = 'none'; }, 3000);
        buzz('heavy');
    }
}

/* ==========================================
   3. GAME ENGINE (Optimized Canvas)
   ========================================== */
const LANES = 4;
const INITIAL_DELAY = 1.8;
const cv = document.getElementById('gameCanvas');
const ctx = cv.getContext('2d', { alpha: false }); // حذف شفافیت برای رندر سریع‌تر

let W = 0, H = 0, LANE_W = 0, HIT_Y = 0, NOTE_W = 0;
let gameRunning = false;
let currentSongKey = 'mountain_king';
let loopDuration = 0;
let startTime = 0;
let score = 0, combo = 0;
let currentLoop = 0;
let targetSpeedFactor = 1.0, currentSpeedFactor = 1.0;
let notesState = [];
let held = [false, false, false, false];

const LANE_HUES = [160, 200, 280, 340];
function hsl(h, s, l, a = 1) { return `hsla(${h}, ${s}%, ${l}%, ${a})`; }

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    // ثابت نگه داشتن DPR روی 1 برای بهینه‌سازی رندر در مینی‌اپ تلگرام
    cv.width = W;
    cv.height = H;
    LANE_W = W / LANES;
    HIT_Y = H - 110;
    NOTE_W = LANE_W * 0.72;
}
window.addEventListener('resize', resize);
resize();

function selectLevel(index) {
    unlockAudioiOS();
    currentLevelIndex = index;
    currentSongKey = LEVELS[index].songKey;
    document.getElementById('menuOverlay').style.display = 'none';
    document.getElementById('backBtn').style.display = 'block';
    startGame();
}

function showMenu() {
    gameRunning = false;
    renderMenu();
    document.getElementById('menuOverlay').style.display = 'flex';
    document.getElementById('backBtn').style.display = 'none';
}

function startGame() {
    gameRunning = true;
    startTime = performance.now() / 1000;
    score = 0; combo = 0; currentLoop = 0;
    targetSpeedFactor = 1.0; currentSpeedFactor = 1.0;
    
    const song = SONGS[currentSongKey];
    let maxStepWithDur = 0;
    song.chart.forEach(item => {
        const endStep = item[0] + item[3] + 4;
        if (endStep > maxStepWithDur) maxStepWithDur = endStep;
    });
    
    loopDuration = maxStepWithDur * song.stepDur;
    notesState = song.chart.map((item, id) => {
        const [step, lane, noteName, durSteps] = item;
        return { 
            id, lane, noteName, baseTime: step * song.stepDur, dur: durSteps * song.stepDur, 
            lastLoop: -1, hit: false, holding: false, completed: false, missed: false 
        };
    });
}

/* ==========================================
   4. INPUT MECHANICS & SCORE CHECK
   ========================================== */
function processInput(lane) {
    if (!gameRunning) return;
    const songTime = (performance.now() / 1000) - startTime;
    let target = null;
    let minDiff = Infinity;

    for (let n of notesState) {
        if (n.lane === lane && !n.hit && !n.missed) {
            let diff = Math.abs(songTime - n.currentTime);
            if (diff < minDiff) {
                minDiff = diff;
                target = n;
            }
        }
    }

    if (target && minDiff <= 0.35) {
        target.hit = true;
        score += 200;
        combo++;
        
        if (target.dur === 0) {
            target.completed = true;
            playPluck(NOTE_FREQS[target.noteName] || 440, 0.4);
        } else {
            target.holding = true;
            playPluck(NOTE_FREQS[target.noteName] || 440, target.dur + 0.3);
        }

        checkScoreForUnlock();
        buzz('light');
    }
}

function checkScoreForUnlock() {
    if (score >= LEVELS[currentLevelIndex].targetScore) {
        unlockNextLevel();
    }
}

cv.addEventListener('touchstart', (e) => {
    e.preventDefault();
    unlockAudioiOS();
    const rect = cv.getBoundingClientRect();
    for (let i = 0; i < e.changedTouches.length; i++) {
        const lane = Math.floor((e.changedTouches[i].clientX - rect.left) / LANE_W);
        if (lane >= 0 && lane < LANES) { held[lane] = true; processInput(lane); }
    }
}, { passive: false });

cv.addEventListener('touchend', (e) => {
    e.preventDefault();
    held.fill(false);
}, { passive: false });

cv.addEventListener('mousedown', (e) => {
    unlockAudioiOS();
    const lane = Math.floor(e.clientX / LANE_W);
    if (lane >= 0 && lane < LANES) { held[lane] = true; processInput(lane); }
});
cv.addEventListener('mouseup', () => { held.fill(false); });

/* ==========================================
   5. RENDER LOOP (Optimized for WebViews)
   ========================================== */
function updateAndDraw() {
    ctx.fillStyle = '#04040a';
    ctx.fillRect(0, 0, W, H);

    const currentTime = performance.now() / 1000;
    const songTime = gameRunning ? (currentTime - startTime) : 0;

    if (gameRunning) {
        const gameTime = Math.max(0, songTime - INITIAL_DELAY);
        const activeLoop = Math.floor(gameTime / loopDuration);

        if (activeLoop > currentLoop) {
            currentLoop = activeLoop;
            targetSpeedFactor += 0.08;
        }

        currentSpeedFactor += (targetSpeedFactor - currentSpeedFactor) * 0.05;

        notesState.forEach(n => {
            let noteLoop = Math.floor((gameTime - n.baseTime + (loopDuration * 0.5)) / loopDuration);
            if (noteLoop < 0) noteLoop = 0;

            if (n.lastLoop !== noteLoop) {
                n.lastLoop = noteLoop;
                n.hit = false;
                n.holding = false;
                n.completed = false;
                n.missed = false;
            }

            n.currentTime = INITIAL_DELAY + n.baseTime + (noteLoop * loopDuration);

            if (n.hit && n.holding && !n.completed) {
                if (!held[n.lane]) {
                    n.holding = false;
                    n.completed = true;
                } else {
                    score += 2;
                    checkScoreForUnlock();
                    if (songTime >= n.currentTime + n.dur) {
                        n.holding = false;
                        n.completed = true;
                        score += 100;
                        checkScoreForUnlock();
                    }
                }
            }
        });
    }

    // ۱. رسم خطوط و دکمه‌ها (بهینه‌شده بدون roundRect)
    for (let i = 0; i < LANES; i++) {
        const cx = i * LANE_W + LANE_W / 2;
        ctx.strokeStyle = hsl(LANE_HUES[i], 80, 50, 0.1);
        ctx.beginPath(); ctx.moveTo(i * LANE_W, 0); ctx.lineTo(i * LANE_W, H); ctx.stroke();

        ctx.fillStyle = held[i] ? hsl(LANE_HUES[i], 100, 50, 0.3) : hsl(LANE_HUES[i], 100, 50, 0.08);
        ctx.fillRect(cx - NOTE_W/2, HIT_Y - 25, NOTE_W, 50);
        ctx.strokeStyle = hsl(LANE_HUES[i], 100, 60, 0.6);
        ctx.strokeRect(cx - NOTE_W/2, HIT_Y - 25, NOTE_W, 50);
    }

    // ۲. رسم نوت‌ها (استفاده از fillRect به جای roundRect برای سرعت بالا)
    if (gameRunning) {
        notesState.forEach(n => {
            const timeDiffHead = n.currentTime - songTime;
            const timeDiffTail = (n.currentTime + n.dur) - songTime;

            const yHead = HIT_Y - ((timeDiffHead * currentSpeedFactor) / 1.8) * HIT_Y;
            const yTail = HIT_Y - ((timeDiffTail * currentSpeedFactor) / 1.8) * HIT_Y;

            if (songTime - n.currentTime > 0.35 && !n.hit) { 
                n.missed = true; 
                combo = 0; 
            }

            if (yHead > -150 && yTail < H + 100 && !n.completed) {
                const cx = n.lane * LANE_W + LANE_W / 2;
                const hue = LANE_HUES[n.lane];

                let topY = (n.dur > 0) ? yTail : yHead - 16;
                let bottomY = (n.dur > 0) ? (n.holding ? HIT_Y : yHead) : yHead + 16;
                let h = Math.max(32, bottomY - topY);

                ctx.fillStyle = n.missed ? '#3a3a48' : hsl(hue, 100, 55);
                ctx.fillRect(cx - NOTE_W / 2, topY, NOTE_W, h);

                ctx.strokeStyle = n.missed ? '#555' : '#ffffff';
                ctx.lineWidth = n.holding ? 3 : 1.5;
                ctx.strokeRect(cx - NOTE_W / 2, topY, NOTE_W, h);
            }
        });
    }

    // ۳. UI و نمایش وضعیت
    if (gameRunning) {
        const currentTarget = LEVELS[currentLevelIndex].targetScore;
        const isCompleted = score >= currentTarget;

        ctx.fillStyle = '#fff';
        ctx.font = '700 15px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(`SCORE: ${score} / ${currentTarget}`, W - 20, 36);
        ctx.fillText(`COMBO: ${combo}`, W - 20, 58);
        ctx.fillText(`SPEED: ${Math.round(currentSpeedFactor * 100)}%`, W - 20, 80);
        
        if (isCompleted) {
            ctx.fillStyle = '#22c55e';
            ctx.fillText(`مرحله بعد باز شد! 🔓`, W - 20, 102);
        }
    }

    requestAnimationFrame(updateAndDraw);
}

renderMenu();
requestAnimationFrame(updateAndDraw);
</script>
</body>
</html>
