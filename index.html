<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <title>Rhythm Master - Classical Edition</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #menuOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1f1f2e 0%, #121212 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
            padding: 30px 20px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            overflow-y: auto;
        }
        .header-container {
            text-align: center;
            margin-bottom: 24px;
        }
        .title {
            color: #F5F5F5;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            text-transform: uppercase;
        }
        .subtitle {
            color: #6366f1;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Arcade Level Grid */
        .levels-grid {
            width: 100%;
            max-width: 360px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .level-card {
            background: linear-gradient(145deg, #1e1e28, #16161e);
            border: 2px solid #2a2a3c;
            border-radius: 20px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.15s ease, border-color 0.15s ease;
            height: 140px;
        }
        .level-card:active {
            transform: scale(0.95);
        }
        .level-card.unlocked {
            border-color: #6366f1;
            background: linear-gradient(145deg, #252538, #1a1a26);
        }
        .level-card.unlocked.has-bg {
            background-image: linear-gradient(rgba(18, 18, 18, 0.5), rgba(18, 18, 18, 0.8)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .level-card.locked {
            border-color: #22222e;
            cursor: not-allowed;
            background: #15151a;
        }
        .level-card.locked.has-bg {
            background-image: linear-gradient(rgba(18, 18, 18, 0.55), rgba(18, 18, 18, 0.75)), var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .level-number {
            font-size: 11px;
            font-weight: 800;
            color: #8a8a9e;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .unlocked .level-number {
            color: #818cf8;
        }
        .song-title-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 4px 0;
            width: 100%;
        }
        .song-name {
            color: #F5F5F5;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
        }
        .target-score {
            color: #A0A0A0;
            font-size: 10px;
            font-weight: 600;
        }
        .stars-row {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .star {
            font-size: 12px;
            color: #333344;
        }
        .star.active {
            color: #fbbf24;
            text-shadow: 0 0 6px rgba(251, 191, 36, 0.6);
        }
        .lock-icon {
            font-size: 22px;
            margin: 8px 0;
        }

        .version-tag {
            color: #666;
            font-size: 11px;
            margin-top: auto;
            font-weight: 700;
            letter-spacing: 1px;
        }
        #backBtn {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 5;
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid #2A2A2A;
            color: #F5F5F5;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            display: none;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        #levelCompleteNotice {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #22c55e;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 800;
            display: none;
            z-index: 6;
            box-shadow: 0 4px 16px rgba(34, 197, 94, 0.5);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div id="levelCompleteNotice">🎉 NEXT LEVEL UNLOCKED!</div>

<div id="menuOverlay">
    <div class="header-container">
        <div class="title">Rhythm Master</div>
        <div class="subtitle">SELECT LEVEL</div>
    </div>
    
    <div id="levelsGrid" class="levels-grid"></div>
    
    <div class="version-tag">v2.2</div>
</div>

<button id="backBtn" onclick="showMenu()">MENU ☰</button>
<canvas id="gameCanvas"></canvas>

<!-- Melody data: to add a new song, create a file like songs/my_song.js
     (copying the pattern of an existing one), add its <script src> below,
     then register it as a level in js/songs.js. -->
<script src="songs/mountain_king.js?v=2.2"></script>
<script src="songs/turkish_march.js?v=2.2"></script>
<script src="songs/fur_elise.js?v=2.2"></script>
<script src="songs/symphony_5.js?v=2.2"></script>

<script src="js/audio.js?v=2.2"></script>
<script src="js/songs.js?v=2.2"></script>
<script src="js/game.js?v=2.2"></script>
</body>
</html>
